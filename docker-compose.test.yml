version: '3.8'

# ==============================================================================
# InsurTech AI Microservice - Automated Test Environment
# ALL PORTS EXCLUSIVELY BOUND TO 127.0.0.1 (ZERO EXTERNAL EXPOSURE)
# ==============================================================================

networks:
  test_network:
    name: insurtech_ai_test_net
    driver: bridge

volumes:
  pgvector_test_data:
  redis_test_data:

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 + pgvector Test Instance (Port 5433)
  # ----------------------------------------------------------------------------
  pgvector-test:
    image: pgvector/pgvector:pg16
    container_name: insurtech-test-pgvector
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_DB=insurtech_ai_test
      - POSTGRES_USER=test_admin
      - POSTGRES_PASSWORD=test_secret_password_only
    volumes:
      - pgvector_test_data:/var/lib/postgresql/data
    networks:
      - test_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_admin -d insurtech_ai_test"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Redis Test Instance (Port 6380)
  # ----------------------------------------------------------------------------
  redis-test:
    image: redis:7-alpine
    container_name: insurtech-test-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_test_data:/data
    networks:
      - test_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Fake Claims Microservice (Port 8082)
  # ----------------------------------------------------------------------------
  fake-claims-test:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        RUN pip install --no-cache-dir fastapi uvicorn
        COPY scripts/fake_claim_service.py /app/fake_claim_service.py
        EXPOSE 8082
        CMD ["python", "fake_claim_service.py"]
    container_name: insurtech-test-fake-claims
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      - FAKE_CLAIMS_PORT=8082
    networks:
      - test_network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8082/healthz\")'"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. InsurTech AI Core Service (APP_ENV=test, Port 5001)
  # ----------------------------------------------------------------------------
  ai-service-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insurtech-test-ai-core
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      - APP_ENV=test
      - ENVIRONMENT=test
      - PORT=5000
      - HOST=0.0.0.0
      - LOG_LEVEL=WARNING
      # Pure deterministic fakes
      - LLM_PROVIDER=mock
      - LLM_MODEL=deterministic-mock
      - DATABASE_URL=postgresql+asyncpg://test_admin:test_secret_password_only@pgvector-test:5432/insurtech_ai_test
      - REDIS_URL=redis://redis-test:6379/0
      - CLAIM_SERVICE_URL=http://fake-claims-test:8082/api/v1/claims
      - JWT_SECRET_KEY=dev-secret-key-for-local-testing-insureflow-32-chars-min
      - JWT_ALGORITHM=HS256
      - RATE_LIMIT_PER_MINUTE=100
      - CORS_ORIGINS=http://localhost:4200,http://127.0.0.1:4200
    depends_on:
      pgvector-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      fake-claims-test:
        condition: service_healthy
    networks:
      - test_network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:5000/healthz\")'"]
      interval: 5s
      timeout: 3s
      retries: 5
