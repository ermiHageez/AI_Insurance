user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    # Rate Limiting Zones (Token Bucket)
    # Chat API: 15 req/sec with burst buffer of 30
    limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=15r/s;
    # Voice WebSocket connections: 5 conn/sec with burst of 10
    limit_req_zone $binary_remote_addr zone=voice_limit:10m rate=5r/s;

    # Upstream definition for AI FastAPI Microservice
    upstream ai_backend {
        server ai-assistant:5000;
        keepalive 32;
    }

    # HTTP Server (Redirect to HTTPS or serve direct in local/staging)
    server {
        listen 80;
        server_name _;

        # Healthcheck endpoint (pass through directly)
        location /healthz {
            proxy_pass http://ai_backend/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Full-duplex Voice WebSocket Endpoint
        location /ws/v1/voice/chat {
            limit_req zone=voice_limit burst=10 nodelay;

            proxy_pass http://ai_backend/ws/v1/voice/chat;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for continuous bidirectional voice stream
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Knowledge Base Document Upload Endpoint (larger payload)
        location /api/v1/kb/documents/upload {
            client_max_body_size 25M;
            proxy_pass http://ai_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Standard REST API & OpenAPI Docs
        location / {
            limit_req zone=chat_limit burst=30 nodelay;

            proxy_pass http://ai_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}
